name: Deploy to Bluehost

# Puts the catalogue code live at stranack.ca/books whenever the site files
# change on main. GitHub asks cPanel to pull the latest commit into its copy
# of the repository, then to run the copy in .cpanel.yml.
on:
  push:
    branches: [main]
    paths: ['books/**', '.cpanel.yml']
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy via cPanel Git Version Control
    env:
      CPANEL_HOST: stranack.ca
      CPANEL_USER: stranack
      REPO_ROOT: /home3/stranack/repositories/calibre-web-catalogue
      TOKEN: ${{ secrets.BLUEHOST_CPANEL_API_TOKEN }}
    steps:
      - name: Check the cPanel token is set up
        id: token
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No BLUEHOST_CPANEL_API_TOKEN secret yet, so nothing was deployed. Add it under Settings > Secrets and variables > Actions."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull latest commit into cPanel-managed repo
        if: steps.token.outputs.ready == 'yes'
        run: |
          resp=$(curl -sS -H "Authorization: cpanel ${CPANEL_USER}:${TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/update?repository_root=${REPO_ROOT}&branch=main")
          echo "$resp"
          status=$(echo "$resp" | python3 -c "import json,sys;print(json.load(sys.stdin).get('status',0))" 2>/dev/null || echo 0)
          if [ "$status" != "1" ]; then
            echo "::error::VersionControl::update did not report success"
            exit 1
          fi

      - name: Deploy HEAD commit (.cpanel.yml tasks)
        if: steps.token.outputs.ready == 'yes'
        run: |
          resp=$(curl -sS -H "Authorization: cpanel ${CPANEL_USER}:${TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create?repository_root=${REPO_ROOT}")
          echo "$resp"
          status=$(echo "$resp" | python3 -c "import json,sys;print(json.load(sys.stdin).get('status',0))" 2>/dev/null || echo 0)
          if [ "$status" != "1" ]; then
            echo "::error::VersionControlDeployment::create did not report success"
            exit 1
          fi
